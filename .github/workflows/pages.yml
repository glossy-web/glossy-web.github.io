name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build the EVTX parser (Rust → WebAssembly)
        run: npm run build:wasm
      - name: Pack the IP-to-ASN database (iptoasn.com, fetched fresh on every build)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/ip2asn-v4-u32.tsv.gz" https://iptoasn.com/data/ip2asn-v4-u32.tsv.gz
          npm run build:ip2asn -- "$RUNNER_TEMP/ip2asn-v4-u32.tsv.gz"
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
