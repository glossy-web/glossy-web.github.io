[package]
name = "evtx-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser bindings for the evtx crate used by glossy-web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evtx = { version = "0.12.3", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# wasm-opt (binaryen) is downloaded at build time by wasm-pack; the build must
# work offline and reproducibly, and LLVM already optimizes with LTO above.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
